<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Virtual Office</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #e5edf7; }
    main { width: min(680px, calc(100% - 40px)); }
    section { padding: 32px; border: 1px solid #334155; border-radius: 16px; background: #172235; box-shadow: 0 20px 60px #0005; }
    h1 { margin: 0 0 12px; }
    p { color: #b8c5d6; line-height: 1.7; }
    .badge { display: inline-block; margin-top: 12px; padding: 7px 11px; border-radius: 999px; background: #123d32; color: #9af0ce; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Virtual Office</h1>
      <p>Public deployment shell. Operational dashboard and source data remain behind the private source boundary.</p>
      <span class="badge">Build-time sanitized deployment</span>
    </section>
  </main>
</body>
</html>
