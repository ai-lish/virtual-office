name: Public projection guard tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test public projections and closed schema
        run: node --test scripts/guard-public-site.test.mjs
