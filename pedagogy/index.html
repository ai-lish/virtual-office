<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>中學／K2 教學法總索引 — 虛擬辦公室</title>
<style>
:root{color-scheme:dark light;--bg:#0f0f23;--card:#16213e;--text:#eee;--dim:#aab3c5;--accent:#64b5f6;--edge:#35435f;--tag:#203e63;--focus:#f5ba4b}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--text:#1e293b;--dim:#536175;--accent:#075fae;--edge:#cbd5e1;--tag:#e7f2ff;--focus:#9b5b00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.55}
a{color:var(--accent);overflow-wrap:anywhere}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px clamp(16px,4vw,36px);background:var(--card);border-bottom:1px solid var(--edge)}
.header>div{min-width:0;max-width:100%}
.header h1{font-size:1.05rem;margin:0}.header p{font-size:.76rem;color:var(--dim);margin:2px 0 0}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--edge);border-radius:8px;color:var(--text);text-decoration:none;font-size:.82rem}
main{width:min(1120px,100%);margin:0 auto;padding:20px 16px 48px}
.intro{color:var(--dim);font-size:.86rem;margin:0 0 16px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr minmax(220px,2fr);gap:10px;margin:16px 0 8px}
.controls label{display:grid;gap:5px;color:var(--dim);font-size:.76rem}
.controls select,.controls input{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
.status{min-height:24px;margin:8px 0 18px;color:var(--dim);font-size:.78rem}
.stage{min-width:0;margin:26px 0}.stage h2{font-size:1.05rem;border-bottom:1px solid var(--edge);padding-bottom:7px;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.card{min-width:0;max-width:100%;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:14px;overflow-wrap:anywhere}
.card h3{font-size:.96rem;margin:0 0 8px;line-height:1.45;overflow-wrap:anywhere}
.english{color:var(--dim);font-weight:500;font-size:.82rem}
.tags{display:flex;min-width:0;max-width:100%;gap:5px;flex-wrap:wrap;margin:0 0 10px}.tag{max-width:100%;min-width:0;padding:2px 8px;border-radius:999px;background:var(--tag);font-size:.7rem;color:var(--accent);white-space:normal;overflow-wrap:anywhere}
.field{margin-top:9px;font-size:.82rem;overflow-wrap:anywhere}.field strong{display:block;font-size:.74rem;color:var(--dim);margin-bottom:2px}.examples{margin:3px 0 0;padding-left:1.2rem}.examples li+li{margin-top:4px}
.origin{margin-top:10px;font-size:.72rem;color:var(--dim)}
.empty,.error{padding:16px;border:1px solid var(--edge);border-radius:10px;color:var(--dim)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media(max-width:640px){.controls{grid-template-columns:minmax(0,1fr)}.header{align-items:flex-start}.header>div{flex-basis:100%}.cards{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="header">
  <div><h1>📚 中學／K2 教學法總索引</h1><p>按工作流程分類 · 正本附來源、理論解說及例子</p></div>
  <a class="btn" href="/virtual-office/">← Skills</a>
</header>
<main>
  <p class="intro">索引只作導航；每張卡的完整定義以所列正本為準。可按階段、媒介篩選，或搜尋中英文名稱、來源及例子。</p>
  <div class="controls" aria-label="教學法篩選">
    <label for="level">學習階段<select id="level"><option value="secondary">中學</option><option value="k2">K2</option></select></label>
    <label for="stage">工作階段<select id="stage"><option value="">全部階段</option></select></label>
    <label for="media">媒介<select id="media"><option value="">全部媒介</option><option value="V">V 影片</option><option value="S">S 投影片</option><option value="P">P 互動練習頁</option><option value="W">W 工作紙及題解</option></select></label>
    <label for="search">文字搜尋<input id="search" type="search" placeholder="例如：交錯練習、Mayer、弧度"></label>
  </div>
  <p class="status" id="status" role="status" aria-live="polite">載入教學法資料…</p>
  <div id="results"></div>
</main>
<script>
const stageNames={W1:'W1 規劃：定目標、對齊、診斷先備',W2:'W2 設計講解：概念、表徵、引入',W3:'W3 例題及解題示範',W4:'W4 練習、提示及回饋',W5:'W5 製作呈現：板書、畫面、動畫、互動介面',W6:'W6 審閱及觀課',W7:'W7 課堂使用及課後跟進',C:'橫跨各階段'};
const mediaNames={V:'V 影片',S:'S 投影片',P:'P 互動練習頁',W:'W 工作紙及題解'};
let cards=[];
const byId=id=>document.getElementById(id);
function addField(card,label,value,linkify=false){
  const section=document.createElement('div');section.className='field';
  const strong=document.createElement('strong');strong.textContent=label;section.append(strong);
  if(linkify){appendLinkedText(section,value)}else{section.append(document.createTextNode(value||''))}
  card.append(section);
}
function addExamples(card,label,values){
  const section=document.createElement('div');section.className='field';
  const strong=document.createElement('strong');strong.textContent=label;section.append(strong);
  const list=document.createElement('ul');list.className='examples';
  for(const value of values){const item=document.createElement('li');item.textContent=value;list.append(item)}
  section.append(list);card.append(section);
}
function appendLinkedText(target,text){
  const pattern=/\[([^\]]+)\]\((https:\/\/[^)]+)\)/g;let cursor=0,match;
  while((match=pattern.exec(text))){target.append(document.createTextNode(text.slice(cursor,match.index)));const link=document.createElement('a');link.textContent=match[1];link.href=match[2];link.target='_blank';link.rel='noopener noreferrer';target.append(link);cursor=pattern.lastIndex}
  target.append(document.createTextNode(text.slice(cursor)));
}
function render(){
  const selectedLevel=byId('level').value,selectedStage=byId('stage').value,selectedMedia=byId('media').value,query=byId('search').value.trim().toLocaleLowerCase();
  const trackCards=cards.filter(item=>item.level===selectedLevel);
  const filtered=trackCards.filter(item=>(!selectedStage||item.workflow.includes(selectedStage))&&(!selectedMedia||item.media.includes(selectedMedia))&&(!query||[item.zh,item.en,item.source,item.theory,(item.examples||[item.example]).join(' '),item.action].join(' ').toLocaleLowerCase().includes(query)));
  const root=byId('results');root.replaceChildren();
  byId('status').textContent=`${selectedLevel==='k2'?'K2':'中學'}：顯示 ${filtered.length}／${trackCards.length} 項教學法`;
  if(!filtered.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='沒有符合條件的教學法。';root.append(empty);return}
  const grouped=new Map();
  for(const item of filtered){for(const stage of item.workflow){if(selectedStage&&stage!==selectedStage)continue;if(!grouped.has(stage))grouped.set(stage,[]);grouped.get(stage).push(item)}}
  for(const [stage,items] of grouped){
    const section=document.createElement('section');section.className='stage';const heading=document.createElement('h2');heading.textContent=stageNames[stage]||stage;section.append(heading);
    const grid=document.createElement('div');grid.className='cards';
    for(const item of items){
      const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.append(document.createTextNode(item.zh+' '));const en=document.createElement('span');en.className='english';en.textContent=`(${item.en})`;title.append(en);card.append(title);
      const tags=document.createElement('div');tags.className='tags';for(const tag of [...item.workflow,...item.media]){const pill=document.createElement('span');pill.className='tag';pill.textContent=stageNames[tag]||mediaNames[tag]||tag;tags.append(pill)}card.append(tags);
      addField(card,'出處',item.source,true);addField(card,'理論解說',item.theory);addExamples(card,selectedLevel==='k2'?'K2 幼兒例子':'香港中學數學例子',item.examples||[item.example]);if(item.action)addField(card,'這一步要做甚麼',item.action);

      grid.append(card)
    }
    section.append(grid);root.append(section)
  }
}
fetch('pedagogy.json').then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).then(data=>{
  if(!Array.isArray(data))throw new Error('JSON 格式不正確');cards=data;
  const stageSelect=byId('stage');for(const [id,name] of Object.entries(stageNames)){const option=document.createElement('option');option.value=id;option.textContent=name;stageSelect.append(option)}
  byId('level').addEventListener('change',render);stageSelect.addEventListener('change',render);byId('media').addEventListener('change',render);byId('search').addEventListener('input',render);render()
}).catch(error=>{byId('status').textContent='無法載入教學法資料';const box=document.createElement('p');box.className='error';box.textContent=error.message;byId('results').replaceChildren(box)});
</script>
</body>
</html>
